[package]
name = "plasma-top"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
publish = false
description = "KDE Plasma panel and tooltip system statistics"

[lib]
path = "src/lib.rs"

[[bin]]
name = "plasma-top"
path = "src/main.rs"

[features]
default = []
# Exposes deterministic fake adapters and fixture loaders to integration tests.
# The feature is never enabled in production builds; CI enables it via
# `--all-features`.
test-support = []
# Enables the safe, runtime-loaded NVML adapter. Missing libnvidia-ml or GPU 0
# remains non-fatal and selects the nvidia-smi fallback.
nvml = ["dep:nvml-wrapper"]

[dependencies]
# Safe wrappers for flock(2), getuid(2), and the HID report poll(2) timeout.
# Chosen over `libc` + scoped `unsafe` so the crate-level
# `#![deny(unsafe_code)]` stays in effect everywhere; `nix` wraps the syscall
# boundaries internally.
# License: MIT. GPL-2.0-or-later compatible. No native build script; pure-Rust
# bindings over libc. See `rust/DEPENDENCIES.md` for the full review row.
nix = { version = "0.29", default-features = false, features = ["fs", "poll", "process", "user"] }
# TOML parser used by production config loading and test fixtures. It remains a
# hard dependency because `config.toml` and `machines.toml` require it; the
# `test-support` feature gates test helpers, not the parser.
# License: MIT OR Apache-2.0. GPL-2.0-or-later compatible. Pure-Rust, no native
# build script. See `rust/DEPENDENCIES.md` for the full review row.
toml = "1"
# Derive-based deserialization for the typed `Config` tree and `Mounts` enum.
# Used by `config::*` to decode TOML while preserving the contract that unknown
# keys are ignored.
# Hard dep: production config loading needs it. License: MIT OR Apache-2.0.
# GPL-2.0-or-later compatible. Pure-Rust, no native build script; pulls in
# `serde_derive` (already in the lock via `toml`'s transitive `serde_core`)
# and re-uses `serde_core` already vendored. See `rust/DEPENDENCIES.md`.
serde = { version = "1", features = ["derive"] }
# Pure-Rust DEFLATE/zlib used by `render::chart` to encode deterministic PNG
# bytes for the graphs page. Chosen over the `png` crate because PlasmaTop
# already rasterizes pixels itself and needs only compression/decompression,
# and over `flate2`/system zlib to avoid native build/runtime dependencies.
# License: MIT OR Zlib OR Apache-2.0. GPL-2.0-or-later compatible. No build
# script; transitive footprint is tiny (`adler2`). See
# `rust/DEPENDENCIES.md` for the review row.
miniz_oxide = "0.8"
# Safe, runtime-loaded NVIDIA Management Library adapter. Optional so the
# default build remains portable; release packaging may enable `nvml` without a
# link-time libnvidia-ml dependency.
# License: MIT. GPL-2.0-or-later compatible. See `rust/DEPENDENCIES.md`.
nvml-wrapper = { version = "0.11", optional = true, default-features = false }
# Small safe wrappers used only at process boundaries. `wait-timeout` provides
# timeout-bound child waits; `signal-hook` provides safe SIGINT/SIGTERM flags.
wait-timeout = "0.2"
signal-hook = "0.3"
# `busctl --json=short` is the production D-Bus transport. JSON decoding keeps
# the project free of a native libdbus dependency and preserves the existing
# fixtureable DbusFacade contract.
serde_json = "1"
