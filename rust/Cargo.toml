[package]
name = "pirostats"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
publish = false
description = "Phase 1 scaffold for the Rust PiroStats migration"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pirostats"
path = "src/main.rs"

[features]
default = []
# Exposes the test-support skeleton so integration tests and downstream lanes
# can share fake adapters, fixture loaders, and oracle runners. The feature is
# never enabled in production builds; CI enables it via `--all-features`.
test-support = []

[dependencies]
# Safe wrappers for the flock(2) serialization in `runtime::page` and the
# getuid(2) lookup in `runtime::runtime_dir`. Chosen over `libc` + scoped
# `unsafe` so the crate-level `#![deny(unsafe_code)]` stays in effect
# everywhere; `nix` wraps the syscall boundaries internally.
# License: MIT. GPL-2.0-or-later compatible. No native build script; pure-Rust
# bindings over libc. See `rust/DEPENDENCIES.md` for the full review row.
nix = { version = "0.29", default-features = false, features = ["fs", "process", "user"] }