[package]
name = "pirostats"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
publish = false
description = "Phase 1 scaffold for the Rust PiroStats migration"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pirostats"
path = "src/main.rs"

[features]
default = []
# Exposes the test-support skeleton so integration tests and downstream lanes
# can share fake adapters, fixture loaders, and oracle runners. The feature is
# never enabled in production builds; CI enables it via `--all-features`.
test-support = []

[dependencies]
# Safe wrappers for flock(2), getuid(2), and the HID report poll(2) timeout.
# Chosen over `libc` + scoped `unsafe` so the crate-level
# `#![deny(unsafe_code)]` stays in effect everywhere; `nix` wraps the syscall
# boundaries internally.
# License: MIT. GPL-2.0-or-later compatible. No native build script; pure-Rust
# bindings over libc. See `rust/DEPENDENCIES.md` for the full review row.
nix = { version = "0.29", default-features = false, features = ["fs", "poll", "process", "user"] }
# TOML parser used by `test_support::fixture_loader` (oracle fixtures) and, in
# the same wave, by `config` (production config.toml/machines.toml parsing).
# Hard dep because production config loading depends on it; the `test-support`
# feature gates the test-support module, not the parser. FIXTURES' original
# proposal gated `toml = "0.8"` behind `test-support`; unified to `1` (a hard
# dep) so CONFIG and FIXTURES share one version.
# License: MIT OR Apache-2.0. GPL-2.0-or-later compatible. Pure-Rust, no native
# build script. See `rust/DEPENDENCIES.md` for the full review row.
toml = "1"
# Derive-based deserialization for the typed `Config` tree (CONFIG lane,
# Wave 2) and the `Mounts` enum (`list[str] | str`). Used by `config::*` to
# decode `config.toml`/`machines.toml` sub-tables into typed structs while
# keeping "ignore unknown keys" (Python's `_from_dict` semantics) for free.
# Hard dep: production config loading needs it. License: MIT OR Apache-2.0.
# GPL-2.0-or-later compatible. Pure-Rust, no native build script; pulls in
# `serde_derive` (already in the lock via `toml`'s transitive `serde_core`)
# and re-uses `serde_core` already vendored. See `rust/DEPENDENCIES.md`.
serde = { version = "1", features = ["derive"] }
# Pure-Rust DEFLATE/zlib used by `render::chart` to encode deterministic PNG
# bytes for the graphs page. Chosen over the `png` crate because PiroStats
# already rasterizes pixels itself and needs only compression/decompression,
# and over `flate2`/system zlib to avoid native build/runtime dependencies.
# License: MIT OR Zlib OR Apache-2.0. GPL-2.0-or-later compatible. No build
# script; transitive footprint is tiny (`adler2`). See
# `rust/DEPENDENCIES.md` for the review row.
miniz_oxide = "0.8"
