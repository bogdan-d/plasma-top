name: Baseline

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}

      - name: Verify committed Cargo.lock stays in sync
        run: |
          cargo fetch --locked --manifest-path rust/Cargo.toml
          git diff --exit-code -- rust/Cargo.lock

      - name: cargo fmt
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: cargo check
        run: cargo check --manifest-path rust/Cargo.toml --all-targets --all-features

      - name: cargo clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --all-features

      - name: cargo doc
        run: cargo doc --manifest-path rust/Cargo.toml --no-deps

      - name: Repository and shell contracts
        run: |
          tools/repository_gate.sh
          bash -n install.sh uninstall.sh packaging/aur/PKGBUILD \
            packaging/aur/plasma-top.install plasma-top tools/*.sh scripts/*.sh

      - name: User-local install lifecycle
        run: tools/user_install_test.sh

      - name: Native package manifest lifecycle
        run: tools/p6_package_test.sh
