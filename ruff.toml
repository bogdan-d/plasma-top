# Ruff config for the retained Python oracle. It is not pip-installable, so this
# stays standalone rather than implying a Python package with pyproject.toml.
#
# The point of running ruff here is the F rules (Pyflakes: dead imports, unused
# variables, undefined/redefined names) — real bugs vulture's dead-code gate
# doesn't cover the same way. We select E4/E7/E9 + F and only silence the
# pycodestyle style rules this codebase breaks on purpose, so `ruff check` stays
# green on the current tree and only speaks up for something new and worth fixing.
# E501 (line length) is deliberately left out: the comments here run wide on
# purpose.

target-version = "py311"

[lint]
# Pin the select EXPLICITLY rather than leaning on ruff's default. Ruff's default
# set widened across versions (0.16 flags UP/I/B/SIM/… out of the box), which
# silently turned the gate into a style/modernization enforcer — 275 findings,
# 178 of them UP045 (Optional[x] -> x | None), none of them the F-rule bugs this
# gate exists for. Pinning keeps the gate meaning what the tree was written to.
select = ["E4", "E7", "E9", "F"]
# Each ignore is a deliberate house style, not an oversight:
ignore = [
    "E731",  # assigned lambdas — the metric gates (_g_*) and the cell factories in
             # items.py are declarative lookup tables; def-ing each would scatter them.
    "E702",  # multiple statements per line (semicolons) — chart.py's rasterizer packs
             # a per-pixel loop body onto one line on purpose (buf[p]=…; buf[p+1]=…).
    "E741",  # ambiguous name `l` — used as a short "label" binding in a few dense
             # comprehensions; a house convention, not a variable anyone confuses with 1.
    "E401",  # multiple imports on one line — bolt_battery.py groups its ctypes imports.
]

[lint.per-file-ignores]
# The `page` fast-path (fired once per mouse-wheel notch) runs and exits BEFORE
# importing daemon, so its heavy import sits below that guard by design.
"tools/python_oracle.py" = ["E402"]
